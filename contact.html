<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlas Softs | Contact Us</title>

<link rel="icon" type="image/x-icon" href="Logo.png">

<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->

<header id="header">

    <a href="index.html" class="logo">Atlas Softs</a>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#portfolio">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</header>

<!-- CONTACT SECTION -->

<section class="sec contact" id="contact">

    <div class="content">

        <div class="mxw800p">

            <h3>Send Us A Message</h3>

            <p>
                Fill out the form below and we will get in touch with you shortly.
            </p>

        </div>

        <div class="conactForm">

            <form id="contact-form">

                <div class="row100">

                    <div class="inputBx50">

                        <input 
                        type="text"
                        name="name"
                        placeholder="Full Name"
                        required>

                    </div>

                    <div class="inputBx50">

                        <input 
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required>

                    </div>

                </div>

                <div class="row100">

                    <div class="inputBx100">

                        <textarea
                        name="message"
                        placeholder="Message"
                        required></textarea>

                    </div>

                </div>

                <div class="row100">

                    <div class="inputBx100">

                        <input 
                        type="submit"
                        value="Send Message">

                    </div>

                </div>

            </form>

        </div>

    </div>

</section>

<!-- WHATSAPP -->

<a href="https://wa.me/923096867815"
class="float"
target="_blank">

<i class="fa fa-whatsapp my-float"></i>

</a>

<!-- EMAILJS -->

<script>

emailjs.init("0Gcu0gSbF2R6PxKXM");

document
.getElementById("contact-form")
.addEventListener("submit", function(event){

    event.preventDefault();

    emailjs.sendForm(
        "service_ogb3qnr",
        "template_gov7k1s",
        this
    )

    .then(function(){

        alert("Message Sent Successfully!");

        document
        .getElementById("contact-form")
        .reset();

    })

    .catch(function(error){

        alert("Failed To Send Message");

        console.log(error);

    });

});

</script>
<script type="text/javascript">
window.addEventListener("scroll", function(){
    var header = document.querySelector("header");
    header.classList.toggle("sticky", window.scrollY > 0);
})
</script>
</body>
</html>
